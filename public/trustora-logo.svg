<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112D4E"/>
      <stop offset="100%" stop-color="#1D4168"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#DBE2EF" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Landmark Icon (Exact Lucide Landmark geometry scaled and centered) -->
  <g transform="translate(96, 96) scale(13.333)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <!-- Roof / Pediment Triangle -->
    <path d="M3 10 L12 3 L21 10"/>
    <!-- Architrave Line below Pediment -->
    <path d="M5 10 L19 10"/>
    <!-- Four Classical Columns -->
    <path d="M6 14 L6 18"/>
    <path d="M10 14 L10 18"/>
    <path d="M14 14 L14 18"/>
    <path d="M18 14 L18 18"/>
    <!-- Stylobate / Base -->
    <path d="M4 18 L20 18"/>
    <path d="M2 21 L22 21"/>
  </g>
</svg>
