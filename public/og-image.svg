<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112D4E"/>
      <stop offset="50%" stop-color="#173459"/>
      <stop offset="100%" stop-color="#112D4E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3F72AF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#112D4E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowGrad)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#DBE2EF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo Mark Container -->
  <g transform="translate(140, 195)" filter="url(#shadow)">
    <rect width="130" height="130" rx="28" fill="#112D4E" stroke="#3F72AF" stroke-width="2"/>
    <g transform="translate(25, 25) scale(3.333)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M3 10 L12 3 L21 10"/>
      <path d="M5 10 L19 10"/>
      <path d="M6 14 L6 18"/>
      <path d="M10 14 L10 18"/>
      <path d="M14 14 L14 18"/>
      <path d="M18 14 L18 18"/>
      <path d="M4 18 L20 18"/>
      <path d="M2 21 L22 21"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Trustora Bank</text>
  <text x="300" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#3F72AF" letter-spacing="4">SECURE DIGITAL BANKING PLATFORM</text>

  <!-- Tagline / Description -->
  <text x="140" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#DBE2EF">
    Manage your accounts, transactions, deposits, withdrawals, and loans with Trustora Bank.
  </text>
  <text x="140" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#9CA3AF">
    Enterprise security, multi-role operations, and real-time financial control.
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="620" width="1200" height="10" fill="#3F72AF"/>
</svg>
